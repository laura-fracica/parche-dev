       <ul>
          <li>La entrada es gratuita y los cupos son limitados. Completa el formulario para reservar el tuyo.</li>
          <li>Los campos marcados con <strong>*</strong> son obligatorios.</li>
       </ul> 

       <main id="Inscripcion">
            <fieldset>
                <legend>Tus datos:</legend>
                <p>
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" name="nombre" id="nombre">
                </p>
                <p>
                    <label for="apellidos.">Apellidos completos: </label>
                    <input type="text" name="apellidos" id="apellidos">
                </p>
                <p>
                    <label for="correo.">Correo: </label>
                    <input type="text" name="correo" id="correo">
                </p>
                <p>
                    <label for="Celular.">Celular: </label>
                    <input type="tel" name="celular" id="celular" placeholder="3003214569" required>
                </p>
                <p>
                    <label for="opciones.">Elige una ciudad: </label>
                        <select name="ciudad" id="ciudad">
                        <option value="medellin">Medellin</option>
                        <option value="Bello">Bello</option>
                        <option value="Itagui">Itagui</option>
                    </select>
                </p>
            </fieldset>


       </main>
